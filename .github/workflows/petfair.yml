name: petfair-scrape

on:
  schedule:
    # 매주 월요일 06:00 KST = 일요일 21:00 UTC
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Scrape
        id: scrape
        run: python scrape_kpet.py

      - name: Commit if changed
        if: success()
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json snapshots/latest.html
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          COUNT=$(python -c "import json; print(json.load(open('events.json'))['count'])")
          git commit -m "auto: 펫페어 일정 갱신 (${COUNT}건)"
          git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today  = new Date().toISOString().slice(0,10);
            const body = [
              `실행 로그: ${runUrl}`,
              ``,
              `흔한 원인 3가지:`,
              `- 케이펫페어 사이트 리뉴얼로 카드 마크업이 바뀌었을 수 있어요.`,
              `- 스크레이퍼 요청이 차단됐거나 응답이 5만자 미만으로 너무 짧을 수 있어요.`,
              `- 페이지 구조 변경으로 파싱 결과가 10건 미만이라 안전판이 걸렸을 수 있어요.`,
              ``,
              `조사 시작점: snapshots/latest.html 을 열어서 카드 태그 구조부터 확인하세요.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `펫페어 수집 실패 — ${today}`,
              body,
            });
